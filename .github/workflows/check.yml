name: Check Rip Manager changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r rip_manager_container/requirements-dev.txt

      - name: Check Python syntax
        run: python3 -m compileall -q rip_manager_container/app rip_manager_container/simulator_node.py rip_manager_container/tests

      - name: Run security and regression tests
        env:
          PYTHONPATH: rip_manager_container/app
        run: pytest -q rip_manager_container/tests

      - name: Check JavaScript syntax
        run: node --check rip_manager_container/app/static/app.js

      - name: Check HTML and CSS
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          Parser().feed(Path("rip_manager_container/app/static/index.html").read_text())
          css = Path("rip_manager_container/app/static/styles.css").read_text()
          if css.count("{") != css.count("}"):
              raise SystemExit("Unbalanced CSS braces")
          PY

      - name: Check Compose configuration
        run: docker compose -f rip_manager_container/docker-compose.yml config >/dev/null
