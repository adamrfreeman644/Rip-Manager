name: Rip Manager reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: rip_manager_container/app:rip_manager_container
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            rip_manager_container/requirements.txt
            rip_manager_container/requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare container-style test mounts
        run: sudo mkdir -p /data /config /updates && sudo chown -R "$USER":"$USER" /data /config /updates
      - name: Install dependencies
        run: python -m pip install -r rip_manager_container/requirements-dev.txt psutil
      - name: Compile Python
        run: python -m compileall -q rip_manager_container/app rip_manager_container/simulator_node.py rip_manager_container/tests
      - name: Run complete Python test suite
        run: python -m pytest -q rip_manager_container/tests
      - name: Check JavaScript syntax
        run: |
          node --check rip_manager_container/app/static/app.js
          node --check rip_manager_container/app/static/archive.js
          node --check rip_manager_container/app/static/library.js
          node --check rip_manager_container/app/static/downloads.js
      - name: Check HTML and CSS
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser): pass
          Parser().feed(Path("rip_manager_container/app/static/index.html").read_text())
          css = Path("rip_manager_container/app/static/styles.css").read_text()
          css += Path("rip_manager_container/app/static/archive.css").read_text()
          if css.count("{") != css.count("}"):
              raise SystemExit("Unbalanced CSS braces")
          PY
      - name: Validate Compose
        run: docker compose -f rip_manager_container/docker-compose.yml config >/dev/null
