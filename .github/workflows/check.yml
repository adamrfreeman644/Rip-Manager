name: Rip Manager reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: rip_manager_container/app:rip_manager_container
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            rip_manager_container/requirements.txt
            rip_manager_container/requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare container-style test mounts
        run: sudo mkdir -p /data /config /updates && sudo chown -R "$USER":"$USER" /data /config /updates
      - name: Install dependencies
        run: python -m pip install -r rip_manager_container/requirements-dev.txt psutil
      - name: Compile Python
        run: python -m compileall -q rip_manager_container/app rip_manager_container/simulator_node.py rip_manager_container/tests
      - name: Run complete Python test suite
        run: python -m pytest -q -W error rip_manager_container/tests
      - name: Check JavaScript syntax
        run: |
          node --check rip_manager_container/app/static/navigation.js
          node rip_manager_container/tests/test_navigation.cjs
          node --check rip_manager_container/app/static/actions.js
          node --check rip_manager_container/app/static/dialogs.js
          node rip_manager_container/tests/test_actions.cjs
          node --check rip_manager_container/app/static/ui.js
          node rip_manager_container/tests/test_confirmation.cjs
          node --check rip_manager_container/app/static/settings.js
          node rip_manager_container/tests/test_settings_search.cjs
          node --check rip_manager_container/app/static/app.js
          node --check rip_manager_container/app/static/archive.js
          node --check rip_manager_container/app/static/library.js
          node --check rip_manager_container/app/static/downloads.js
          node --check rip_manager_container/app/static/transfer_view.js
          node rip_manager_container/tests/test_drive_visibility.cjs
          node rip_manager_container/tests/test_transfer_view.cjs
          node rip_manager_container/tests/test_library_first_load.cjs
          node rip_manager_container/tests/test_library_search.cjs
      - name: Install GUI browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise GUI in Chromium
        run: node rip_manager_container/tests/test_gui_browser.cjs
      - name: Save GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: gui-test-artifacts/
          if-no-files-found: ignore
      - name: Check HTML and CSS
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser): pass
          Parser().feed(Path("rip_manager_container/app/static/index.html").read_text())
          css = Path("rip_manager_container/app/static/styles.css").read_text()
          css += Path("rip_manager_container/app/static/archive.css").read_text()
          css += Path("rip_manager_container/app/static/settings.css").read_text()
          css += Path("rip_manager_container/app/static/fluent.css").read_text()
          if css.count("{") != css.count("}"):
              raise SystemExit("Unbalanced CSS braces")
          PY
      - name: Validate Compose
        run: docker compose -f rip_manager_container/docker-compose.yml config >/dev/null
