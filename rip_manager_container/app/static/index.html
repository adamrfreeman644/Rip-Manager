<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Rip Remote</title>
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/styles.css?v=0.25.27">
  <link rel="stylesheet" href="/static/archive.css?v=0.25.27">
  <link rel="stylesheet" href="/static/settings.css?v=0.25.27">
  <link rel="stylesheet" href="/static/fluent.css?v=0.25.27">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png?v=0.10.6">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png?v=0.10.6">
  <link rel="apple-touch-icon" sizes="512x512" href="/static/icons/remote-ripper-512.png?v=0.10.6">
</head>
<body>
<div class="app">
  <header class="v02-header">
    <button class="v02-brand" id="brandRefresh" type="button" title="Refresh Rip Manager" aria-label="Refresh Rip Manager">
      <div class="v02-brand-icon-wrap" aria-hidden="true">
        <img class="v02-brand-icon v02-brand-icon-light" src="/static/icons/remote-ripper-header-light.png?v=0.10.6" alt="">
        <img class="v02-brand-icon v02-brand-icon-dark" src="/static/icons/remote-ripper-header-dark.png?v=0.10.6" alt="">
      </div>
      <div class="v02-brand-divider" aria-hidden="true"></div>
      <div class="v02-brand-copy">
        <div class="v02-eyebrow">RIP MANAGER</div>
        <div class="v02-brand-title-row">
          <h1>Rip Remote</h1>
          <div class="v02-version" id="managerVersion">Loading version…</div>
        </div>
      </div>
    </button>
    <div class="v02-actions">
      <span id="connection" class="v02-pill">Connecting…</span>
      <div class="mobile-nav-wrap">
        <button class="v02-icon mobile-nav-toggle" id="mobileNavToggle" type="button" title="Menu" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNavMenu">☰</button>
        <nav class="mobile-nav-menu hidden" id="mobileNavMenu" aria-label="Main menu">
          <button type="button" data-mobile-action="dashboard" data-app-route="dashboard"><span>Dashboard</span><span aria-hidden="true">⌂</span></button>
          <button type="button" data-mobile-action="library" data-app-route="library"><span>Library</span><span aria-hidden="true">⌕</span></button>
          <button type="button" data-mobile-action="downloads" data-app-route="downloads"><span>Downloads</span><span aria-hidden="true">↓</span></button>
          <button type="button" data-mobile-action="mover" data-app-route="mover"><span>Mover</span><span aria-hidden="true">⇄</span></button>
          <button type="button" data-mobile-action="stats" data-app-route="stats"><span>Stats</span><span aria-hidden="true">ϟ</span></button>
          <a href="/local-ai" style="display:block;padding:12px">Local AI organiser</a>
          <div class="mobile-nav-divider" aria-hidden="true"></div>
          <button type="button" data-mobile-action="settings" data-app-route="settings"><span>Settings</span><span aria-hidden="true">⚙</span></button>
        </nav>
      </div>
    </div>
  </header>
  <div class="mobile-nav-backdrop hidden" id="mobileNavBackdrop" aria-hidden="true"></div>
  <main id="driveGrid" class="drive-grid" aria-live="polite"></main>
</div>

<div id="intakeModal" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="intakeHeading">
    <div class="modal-head">
      <div class="modal-title" id="intakeHeading">Drive</div>
      <button class="close-btn" data-close="intakeModal">Close</button>
    </div>
    <div class="note" id="intakeNote">Scan a barcode or enter the disc details.</div>
    <div class="disc-label-info hidden" id="discLabelInfo"></div>

    <div id="upcArea" class="intake-section">
      <label for="upcInput">Barcode</label>
      <div class="upc-row">
        <input id="upcInput" inputmode="none" autocomplete="off" aria-label="Barcode scan">
        <button class="primary" type="button" id="lookupButton">Lookup</button>
        <button class="secondary" type="button" id="clearUpc">Clear</button>
      </div>
      <div class="scan-status" id="lookupStatus" role="status" aria-live="polite" aria-atomic="true">Ready to scan</div>
      <div class="actions">
        <button class="secondary action-full" type="button" id="skipUpc">Enter details manually</button>
      </div>
      <div class="drive-popup-actions" id="barcodeActions"></div>
    </div>

    <form id="ripForm" class="intake-section hidden">
      <input id="nodeId" type="hidden">
      <input id="driveName" type="hidden">

      <label for="mediaTitle" id="mediaTitleLabel">Title</label>
      <input id="mediaTitle" required autocomplete="off" placeholder="The Italian Job">

      <div class="row">
        <div>
          <label for="mediaYear">Year</label>
          <input id="mediaYear" type="number" min="1880" max="2200" placeholder="1969">
        </div>
        <div>
          <label for="mediaType">Type</label>
          <select id="mediaType">
            <option value="movie">Movie</option>
            <option value="tv">TV / Box Set</option>
            <option value="music">Music CD</option>
            <option value="audiobook">Audiobook CD</option>
          </select>
        </div>
      </div>

      <div id="audioFields" class="hidden">
        <div class="row">
          <div>
            <label for="mediaCreator" id="mediaCreatorLabel">Artist / Author</label>
            <input id="mediaCreator" autocomplete="off">
          </div>
          <div id="narratorField">
            <label for="mediaNarrator">Narrator</label>
            <input id="mediaNarrator" autocomplete="off">
          </div>
        </div>
        <label for="audioDisc">Disc number</label>
        <input id="audioDisc" type="number" min="1" value="1">
      </div>

      <div id="tvFields" clas
