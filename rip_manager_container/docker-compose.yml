services:
  rip-manager:
    build: .
    container_name: rip-manager
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]"
      net.unraid.docker.icon: "/mnt/user/appdata/rip-manager/rip_manager_container/app/static/icons/remote-ripper-512.png"
    ports:
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./config:/config
      - /mnt/user/Updater:/updates
      - /boot/config/rip-github/token:/run/secrets/github-token:ro
    environment:
      RIP_MANAGER_IDLE_POLL: "5"
      RIP_MANAGER_ACTIVE_POLL: "2"
      RIP_MANAGER_REQUEST_TIMEOUT: "8"
      RIP_MANAGER_UPDATES: "/updates"
      RIP_GITHUB_OWNER: "Adamrfreeman644"
      RIP_GITHUB_MANAGER_REPO: "rip-manager"
      RIP_MANAGER_SHARED_UPDATER_URL: "${RIP_MANAGER_SHARED_UPDATER_URL:-http://host.docker.internal:8093/apps/rip-manager}"
      RIP_MANAGER_COOKIE_SECURE: "0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
