services:
  rip-manager:
    build: .
    container_name: rip-manager
    restart: unless-stopped
    labels:
      # Unraid Docker/Compose Manager integration.
      # The square logo is intentionally used here because it reads well in
      # both light and dark Unraid themes.
      net.unraid.docker.managed: "composeman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]"
      net.unraid.docker.icon: "/mnt/user/appdata/rip-manager/rip_manager_container/app/static/icons/remote-ripper-512.png"
    ports:
      - "8088:8080"
    # Lets Rip Manager reach a Rip Node running on this same physical host.
    # In Settings use http://host.docker.internal:8000 for that case.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./config:/config
      - /mnt/user/Updater:/updates
      - /boot/config/rip-github/token:/run/secrets/github-token:ro
    environment:
      RIP_MANAGER_IDLE_POLL: "5"
      RIP_MANAGER_ACTIVE_POLL: "2"
      RIP_MANAGER_REQUEST_TIMEOUT: "8"
      RIP_MANAGER_UPDATES: "/updates"
      RIP_GITHUB_OWNER: "Adamrfreeman644"
      RIP_GITHUB_MANAGER_REPO: "rip-manager"
      # Set to 1 once Rip Manager is served over HTTPS so the session cookie
      # is only ever sent on an encrypted connection.
      RIP_MANAGER_COOKIE_SECURE: "0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
