services:
  rip-manager:
    build: .
    container_name: rip-manager
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]"
      net.unraid.docker.icon: "/mnt/user/appdata/rip-manager/rip_manager_container/app/static/icons/remote-ripper-512.png"
    ports:
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PROJECT_DIR:-.}/data:/data
      - ${HOST_PROJECT_DIR:-.}/config:/config
      - /mnt/user/Updater:/updates
      - ${HOST_MEDIA_DIR:-/mnt/user/Media}:/media
      - ${HOST_RIP_NODE_1_DIR:-/mnt/remotes/rip-node-1_ripping}:/rip-nodes/rip-node-1
      - /boot/config/rip-github/token:/run/secrets/github-token:ro
    environment:
      RIP_MANAGER_IDLE_POLL: "5"
      RIP_MANAGER_ACTIVE_POLL: "2"
      RIP_MANAGER_REQUEST_TIMEOUT: "8"
      RIP_MANAGER_UPDATES: "/updates"
      RIP_GITHUB_OWNER: "Adamrfreeman644"
      RIP_GITHUB_MANAGER_REPO: "rip-manager"
      RIP_MANAGER_COOKIE_SECURE: "0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rip-manager-updater:
    image: docker:27-cli
    container_name: rip-manager-updater
    working_dir: /project
    command: ["sh", "-c", "apk add --no-cache bash curl jq unzip tar >/dev/null 2>&1 && bash /project/updater.sh"]
    environment:
      RIP_GITHUB_OWNER: "Adamrfreeman644"
      RIP_GITHUB_MANAGER_REPO: "rip-manager"
      RIP_MANAGER_PROJECT_DIR: "/project"
      RIP_MANAGER_STATE_DIR: "/updates/State"
      RIP_GITHUB_TOKEN_FILE: "/run/secrets/github-token"
    volumes:
      - ./:/project
      - /mnt/user/Updater:/updates
      - /boot/config/rip-github/token:/run/secrets/github-token:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
